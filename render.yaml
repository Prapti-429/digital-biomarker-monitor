services:
  # ---------------------------------------------------------------------------
  # 1. FastAPI Backend Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: digital-biomarker-backend
    env: python
    region: oregon
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DATABASE_URL
        fromDatabase:
          name: digital-biomarker-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://digital-biomarker-monitor.onrender.com
      - key: ENVIRONMENT
        value: production

  # ---------------------------------------------------------------------------
  # 2. React Vite Frontend Static Site
  # ---------------------------------------------------------------------------
  - type: web
    name: digital-biomarker-frontend
    env: static
    region: oregon
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://digital-biomarker-backend.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# -----------------------------------------------------------------------------
# 3. Managed PostgreSQL Database Instance
# -----------------------------------------------------------------------------
databases:
  - name: digital-biomarker-db
    databaseName: biomarker_db
    user: biomarker_user
    region: oregon
    plan: starter
