services:
  - type: web
    name: digital-biomarker-backend
    env: python
    region: oregon
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://digital-biomarker-monitor.onrender.com
      - key: ENVIRONMENT
        value: production

  - type: web
    name: digital-biomarker-frontend
    env: static
    region: oregon
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://digital-biomarker-backend.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
